name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'guides/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'guides/**', 'LICENSE', '.gitignore']

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2
    permissions:
      contents: write
      pull-requests: write
    with:
      version-file: '.tool-versions'
      enable-fmt: false
      enable-audit: false
      enable-sbom: true
      enable-sbom-scan: true
      enable-dependency-submission: true
      enable-summary: true
